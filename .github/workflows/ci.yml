name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Reuses the exact command docs/DOCKER.md documents and
      # .claude/hooks/build-and-test.sh runs locally on every source
      # edit -- one definition of "does the project pass," not a
      # separate CI-only build.
      - name: Build and run the EdgarVPN test suite
        run: >
          docker compose --profile test up --build
          --abort-on-container-exit --exit-code-from test

      - name: Tear down
        if: always()
        run: docker compose --profile test down
