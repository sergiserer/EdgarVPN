# ForgeVPN peer configuration -- see docs/CONFIGURATION.md
#
# DEMO KEYS: generated with `forgevpn-keygen` purely for this local
# Docker demo. They are committed to a public repository, so they carry
# zero security value -- never reuse demo keys for anything real.
#
# Full mesh: peer2 connects to all four other peers. Role rule: the
# lower-numbered peer is always the initiator toward the higher-numbered
# one (see docs/NETWORKING.md).

[Interface]
Name = peer2
DeviceName = forge0
Address = 10.8.0.12/24
ListenPort = 51820
PrivateKey = m6JQ7qCjb4Fhxhfu+SwmFwGH5MlP+OWc0VGTyKbwyZs=

# peer1
[Peer]
Endpoint = peer1:51820
PublicKey = bjfbU3msXbcFOrDX2YMFib9KDoCBmcP+pfLy4vlUOQk=
Role = responder
AllowedIPs = 10.8.0.11/32

# peer3
[Peer]
Endpoint = peer3:51820
PublicKey = 0FVZjAkYgypGgyY0WCwES0D3uyhah916CLstGRmizWo=
Role = initiator
AllowedIPs = 10.8.0.13/32

# peer4
[Peer]
Endpoint = peer4:51820
PublicKey = aLN+xT7hij7+XG4sbmPJWat9yh61hT6dF1+iyqm1Fzw=
Role = initiator
AllowedIPs = 10.8.0.14/32

# peer5
[Peer]
Endpoint = peer5:51820
PublicKey = xnLu01uSODzzlNOxzow5GbrW5JE0j1dDho1weCbxmDI=
