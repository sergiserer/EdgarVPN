# EdgarVPN peer configuration -- see docs/CONFIGURATION.md
#
# DEMO KEYS: generated with `edgarvpn-keygen` purely for this local
# Docker demo. They are committed to a public repository, so they carry
# zero security value -- never reuse demo keys for anything real.
#
# Full mesh: peer1 connects to all four other peers. Role rule: the
# lower-numbered peer is always the initiator toward the higher-numbered
# one (see docs/NETWORKING.md).

[Interface]
Name = peer1
DeviceName = edgar0
Address = 10.8.0.11/24
ListenPort = 51820
PrivateKey = 6xDFaKxS6uz+VDDQv+duhId7lz4/LXXDWXxQJxjRgv8=

# peer2
[Peer]
Endpoint = peer2:51820
PublicKey = O4ahwgWhMg3i1fmgQHG4AD0dhhCqXVcUanRiahOnPGU=
Role = initiator
AllowedIPs = 10.8.0.12/32

# peer3
[Peer]
