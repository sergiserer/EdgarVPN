# EdgarVPN peer configuration -- see docs/CONFIGURATION.md
#
# DEMO KEYS: generated with `edgarvpn-keygen` purely for this local
# Docker demo. They are committed to a public repository, so they carry
# zero security value -- never reuse demo keys for anything real.
#
# Full mesh: peer5 connects to all four other peers. Role rule: the
# lower-numbered peer is always the initiator toward the higher-numbered
# one (see docs/NETWORKING.md) -- so peer5, being the highest-numbered
# peer, is a responder to everyone.

[Interface]
Name = peer5
DeviceName = edgar0
Address = 10.8.0.15/24
ListenPort = 51820
PrivateKey = vF87ZRu70RloARxksxB5nrVMhbvKps3UQWAxjLCFhVA=

# peer1
[Peer]
Endpoint = peer1:51820
PublicKey = bjfbU3msXbcFOrDX2YMFib9KDoCBmcP+pfLy4vlUOQk=
Role = responder
AllowedIPs = 10.8.0.11/32

# peer2
[Peer]
Endpoint = peer2:51820
PublicKey = O4ahwgWhMg3i1fmgQHG4AD0dhhCqXVcUanRiahOnPGU=
Role = responder
AllowedIPs = 10.8.0.12/32

# peer3
[Peer]
Endpoint = peer3:51820
PublicKey = 0FVZjAkYgypGgyY0WCwES0D3uyhah916CLstGRmizWo=
Role = responder
AllowedIPs = 10.8.0.13/32

# peer4
