# EdgarVPN development & demonstration environment.
#
# Every peer runs in its own container on a dedicated bridge network,
# simulating independent machines communicating over UDP. No host
# networking configuration is required.
#
# Usage:
#   docker compose --profile demo up --build        # 2 peers, tunnel demo
#   docker compose --profile multi-peer up --build   # 5 peers, scalability demo
#   docker compose --profile test up --build --abort-on-container-exit
#
# See docs/DOCKER.md for the design rationale and docs/CONFIGURATION.md
# for the format of the files under configs/.

x-peer-base: &peer-base
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  networks:
    - edgarvpn-net
  stdin_open: true
  tty: true
  restart: "no"

services:
  peer1:
    <<: *peer-base
    container_name: edgarvpn-peer1
    hostname: peer1
    volumes:
      - ./configs/peer1.conf:/etc/edgarvpn/edgarvpn.conf:ro
    networks:
      edgarvpn-net:
        ipv4_address: 10.10.0.11
    profiles: ["demo", "multi-peer"]

  peer2:
    <<: *peer-base
    container_name: edgarvpn-peer2
    hostname: peer2
    volumes:
      - ./configs/peer2.conf:/etc/edgarvpn/edgarvpn.conf:ro
    networks:
      edgarvpn-net:
        ipv4_address: 10.10.0.12
    profiles: ["demo", "multi-peer"]

  peer3:
    <<: *peer-base
    container_name: edgarvpn-peer3
    hostname: peer3
    volumes:
      - ./configs/peer3.conf:/etc/edgarvpn/edgarvpn.conf:ro
    networks:
      edgarvpn-net:
        ipv4_address: 10.10.0.13
    profiles: ["multi-peer"]

  peer4:
    <<: *peer-base
    container_name: edgarvpn-peer4
    hostname: peer4
    volumes:
      - ./configs/peer4.conf:/etc/edgarvpn/edgarvpn.conf:ro
    networks:
      edgarvpn-net:
        ipv4_address: 10.10.0.14
    profiles: ["multi-peer"]

  # peer5's config has no [Peer] section on purpose: N-way routing isn't
  # implemented yet (see docs/NETWORKING.md), so it runs in capture-only
  # mode -- proof the topology still builds and starts with an odd peer out.
  peer5:
    <<: *peer-base
    container_name: edgarvpn-peer5
    hostname: peer5
    volumes:
      - ./configs/peer5.conf:/etc/edgarvpn/edgarvpn.conf:ro
    networks:
      edgarvpn-net:
        ipv4_address: 10.10.0.15
    profiles: ["multi-peer"]

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    container_name: edgarvpn-test
    # tun_test creates a real TUN interface, so the test container needs
    # the same capabilities as a peer -- this is an integration test, not
    # a hermetic unit test. config_test and udp_test need neither
    # capability, only /tmp and loopback sockets.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    profiles: ["test"]

networks:
  edgarvpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
