# ForgeVPN development & demonstration environment.
#
# Every peer runs in its own container on a dedicated bridge network,
# simulating independent machines communicating over UDP. No host
# networking configuration is required.
#
# Usage:
#   docker compose --profile demo up --build        # 2 peers, tunnel demo
#   docker compose --profile multi-peer up --build   # 5 peers, scalability demo
#   docker compose --profile test up --build --abort-on-container-exit
#
# See docs/DOCKER.md for the design rationale.

x-peer-base: &peer-base
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  networks:
    - forgevpn-net
  stdin_open: true
  tty: true
  restart: "no"

services:
  peer1:
    <<: *peer-base
    container_name: forgevpn-peer1
    hostname: peer1
    environment:
      PEER_NAME: peer1
      TUN_ADDRESS: 10.8.0.11
      PEER_ENDPOINT: peer2:51820
    networks:
      forgevpn-net:
        ipv4_address: 10.10.0.11
    profiles: ["demo", "multi-peer"]

  peer2:
    <<: *peer-base
    container_name: forgevpn-peer2
    hostname: peer2
    environment:
      PEER_NAME: peer2
      TUN_ADDRESS: 10.8.0.12
      PEER_ENDPOINT: peer1:51820
    networks:
      forgevpn-net:
        ipv4_address: 10.10.0.12
    profiles: ["demo", "multi-peer"]

  peer3:
    <<: *peer-base
    container_name: forgevpn-peer3
    hostname: peer3
    environment:
      PEER_NAME: peer3
      TUN_ADDRESS: 10.8.0.13
      PEER_ENDPOINT: peer4:51820
    networks:
      forgevpn-net:
        ipv4_address: 10.10.0.13
    profiles: ["multi-peer"]

  peer4:
    <<: *peer-base
    container_name: forgevpn-peer4
    hostname: peer4
    environment:
      PEER_NAME: peer4
      TUN_ADDRESS: 10.8.0.14
      PEER_ENDPOINT: peer3:51820
    networks:
      forgevpn-net:
        ipv4_address: 10.10.0.14
    profiles: ["multi-peer"]

  # peer5 has no PEER_ENDPOINT on purpose: N-way routing isn't implemented
  # yet (see docs/NETWORKING.md), so it runs in capture-only mode --
  # proof the topology still builds and starts with an odd peer out.
  peer5:
    <<: *peer-base
    container_name: forgevpn-peer5
    hostname: peer5
    environment:
      PEER_NAME: peer5
      TUN_ADDRESS: 10.8.0.15
    networks:
      forgevpn-net:
        ipv4_address: 10.10.0.15
    profiles: ["multi-peer"]

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    container_name: forgevpn-test
    # tun_test creates a real TUN interface, so the test container needs
    # the same capabilities as a peer -- this is an integration test, not
    # a hermetic unit test.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    profiles: ["test"]

networks:
  forgevpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
